name: Deploy App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Connected successfully"
            whoami
            pwd
            ls
            export PATH=$PATH:/usr/local/bin:/usr/bin

            cd ~/react-2026
            git pull origin main
            npm install
            npm run build

            if pm2 describe react-2026 > /dev/null 2>&1; then
              pm2 restart react-2026
            else
              pm2 start "serve -s dist -l 3000" --name react-2026
            fi

            pm2 save